<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111318">

<title>電錶紀錄 · Fuse vs Tracker</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#111318;
  color:#f4f4f5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.container{
  max-width:520px;
  margin:auto;
  padding:18px 14px 40px;
}
h1{font-size:24px;margin:5px 0 4px}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 8px}
p{color:#a9adb7;font-size:13px;line-height:1.5}

.card{
  background:#1a1d23;
  border:1px solid #292d35;
  border-radius:16px;
  padding:15px;
  margin:12px 0;
}

label{
  display:block;
  font-size:12px;
  color:#a9adb7;
  margin:10px 0 5px;
}

input,select,button{
  width:100%;
  border:0;
  border-radius:10px;
  padding:12px;
  font-size:15px;
}

input,select{
  background:#242832;
  color:#fff;
}

button{
  background:#fff;
  color:#111;
  font-weight:700;
  cursor:pointer;
  margin-top:10px;
}

button.secondary{
  background:#292e38;
  color:#fff;
}

button.danger{
  background:#54262a;
  color:#ffb5ba;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat{
  background:#242832;
  border-radius:12px;
  padding:12px;
}

.stat .title{
  color:#9da3ae;
  font-size:11px;
}

.stat .value{
  font-size:19px;
  font-weight:700;
  margin-top:4px;
}

.hero{
  padding:18px;
  border-radius:18px;
  background:#20252e;
  margin:12px 0;
}

.hero .big{
  font-size:31px;
  font-weight:800;
}

.good{color:#8ee6a7}
.bad{color:#ff9b9b}
.muted{color:#8f95a0}

.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin:12px 0;
}

.tab{
  background:#20242b;
  color:#aeb3bd;
  margin:0;
}

.tab.active{
  background:#fff;
  color:#111;
}

.entry{
  border-top:1px solid #2b3038;
  padding:13px 0;
}

.entry:first-child{border-top:0}

.entry-date{
  font-weight:700;
}

.small{
  font-size:12px;
  color:#9da3ae;
  line-height:1.5;
}

.rate-box{
  background:#20252d;
  border-radius:12px;
  padding:12px;
  margin-top:10px;
}

.loading{
  opacity:.65;
}

hr{
  border:0;
  border-top:1px solid #2b3038;
  margin:15px 0;
}

.hidden{display:none!important}
</style>
</head>

<body>

<div class="container">

  <h1>⚡ 電錶紀錄</h1>
  <p>Fuse Fixed vs Octopus Tracker · 未來一年核對</p>

  <!-- SUMMARY -->
  <div class="hero">
    <div class="small">目前比較</div>
    <div class="big" id="summaryDifference">£0.00</div>
    <div class="small" id="summaryText">尚未有足夠數據</div>
  </div>

  <!-- CURRENT RATES -->
  <div class="card">
    <h2>📡 目前 Tracker 價格</h2>

    <div id="trackerStatus" class="small loading">
      正在讀取 Octopus 最新 Tracker 價格…
    </div>

    <div class="rate-box">
      <div class="stats">
        <div class="stat">
          <div class="title">Electricity</div>
          <div class="value" id="trackerElec">—</div>
        </div>

        <div class="stat">
          <div class="title">Gas</div>
          <div class="value" id="trackerGas">—</div>
        </div>

        <div class="stat">
          <div class="title">Electricity standing</div>
          <div class="value" id="trackerElecStanding">—</div>
        </div>

        <div class="stat">
          <div class="title">Gas standing</div>
          <div class="value" id="trackerGasStanding">—</div>
        </div>
      </div>

      <button onclick="loadTrackerRates()">🔄 更新 Tracker 價格</button>
    </div>
  </div>

  <!-- SETTINGS -->
  <div class="card">
    <h2>⚙️ 設定</h2>

    <label>GSP Region</label>
    <select id="region">
      <option value="_B">East Midlands (_B)</option>
      <option value="_A">Eastern England (_A)</option>
      <option value="_C">East Anglia (_C)</option>
      <option value="_D">East Midlands? (_D)</option>
      <option value="_E">West Midlands (_E)</option>
      <option value="_F">North Wales & Merseyside (_F)</option>
      <option value="_G">South Wales (_G)</option>
      <option value="_H">South West England (_H)</option>
      <option value="_J">Southern England (_J)</option>
      <option value="_K">South East England (_K)</option>
      <option value="_L">London (_L)</option>
      <option value="_M">Southern Scotland (_M)</option>
      <option value="_N">Northern Scotland (_N)</option>
      <option value="_P">Northern England (_P)</option>
    </select>

    <h3 style="margin-top:18px">Fuse Fixed</h3>

    <div class="row">
      <div>
        <label>Electricity unit (p/kWh)</label>
        <input id="fuseElecUnit" type="number" step="0.001">
      </div>

      <div>
        <label>Electricity standing (p/day)</label>
        <input id="fuseElecStanding" type="number" step="0.01">
      </div>
    </div>

    <div class="row">
      <div>
        <label>Gas unit (p/kWh)</label>
        <input id="fuseGasUnit" type="number" step="0.001">
      </div>

      <div>
        <label>Gas standing (p/day)</label>
        <input id="fuseGasStanding" type="number" step="0.01">
      </div>
    </div>

    <button onclick="saveSettings()">💾 儲存設定</button>
  </div>

  <!-- ADD READING -->
  <div class="card">
    <h2>📝 新增讀數</h2>

    <label>日期</label>
    <input id="entryDate" type="date">

    <div class="row">
      <div>
        <label>Electricity meter</label>
        <input id="elecReading" type="number" step="0.001">
      </div>

      <div>
        <label>Gas meter</label>
        <input id="gasReading" type="number" step="0.001">
      </div>
    </div>

    <button onclick="addReading()">加入紀錄</button>

    <p>
      每次輸入新讀數後，系統會同上一個讀數計算實際用量，
      再用當日 Tracker / Fuse 價格比較。
    </p>
  </div>

  <!-- FILTER -->
  <div class="card">
    <h2>📊 用量及比較</h2>

    <div class="tabs">
      <button class="tab active" id="tabMonth" onclick="setView('month')">月份</button>
      <button class="tab" id="tabDay" onclick="setView('day')">每日</button>
      <button class="tab" id="tabAll" onclick="setView('all')">全部</button>
    </div>

    <div id="results"></div>
  </div>

  <!-- DATA -->
  <div class="card">
    <h2>💾 資料</h2>

    <button class="secondary" onclick="exportData()">匯出資料</button>
    <button class="secondary" onclick="importData()">匯入資料</button>
    <button class="danger" onclick="clearData()">清除全部資料</button>

    <input
      id="importFile"
      type="file"
      accept=".json"
      class="hidden"
      onchange="handleImport(event)"
    >
  </div>

</div>

<script>

const STORE_KEY = 'octo-tracker-data';

const DEFAULT_SETTINGS = {
  region: '_B',

  fuseElecUnit: 23.24,
  fuseElecStanding: 41.44,

  fuseGasUnit: 7.55,
  fuseGasStanding: 10.83
};

let data = {
  settings: {...DEFAULT_SETTINGS},
  entries: {},
  rates: {}
};

let currentView = 'month';

/* =========================
   STORAGE
========================= */

function loadData(){

  try{
    const saved = localStorage.getItem(STORE_KEY);

    if(saved){
      const parsed = JSON.parse(saved);

      data = {
        settings:{
          ...DEFAULT_SETTINGS,
          ...(parsed.settings || {})
        },
        entries: parsed.entries || {},
        rates: parsed.rates || {}
      };
    }

  }catch(e){
    console.error(e);
  }

  document.getElementById('region').value =
    data.settings.region;

  document.getElementById('fuseElecUnit').value =
    data.settings.fuseElecUnit;

  document.getElementById('fuseElecStanding').value =
    data.settings.fuseElecStanding;

  document.getElementById('fuseGasUnit').value =
    data.settings.fuseGasUnit;

  document.getElementById('fuseGasStanding').value =
    data.settings.fuseGasStanding;
}

function saveData(){
  localStorage.setItem(STORE_KEY, JSON.stringify(data));
}

/* =========================
   SETTINGS
========================= */

function saveSettings(){

  data.settings.region =
    document.getElementById('region').value;

  data.settings.fuseElecUnit =
    Number(document.getElementById('fuseElecUnit').value);

  data.settings.fuseElecStanding =
    Number(document.getElementById('fuseElecStanding').value);

  data.settings.fuseGasUnit =
    Number(document.getElementById('fuseGasUnit').value);

  data.settings.fuseGasStanding =
    Number(document.getElementById('fuseGasStanding').value);

  saveData();

  alert('設定已儲存');

  loadTrackerRates();
  render();
}

/* =========================
   OCTOPUS API
========================= */

/*
  只處理目前有效 Tracker。

  注意：
  Tracker product code 會由 Octopus 官方產品資料決定，
  唔再靠舊日期 version list。
*/

async function findCurrentTrackerProduct(){

  const region =
    data.settings.region.replace('_','');

  /*
    先讀目前 products。
  */

  const url =
    'https://api.octopus.energy/v1/products/?page_size=100';

  const response = await fetch(url);

  if(!response.ok){
    throw new Error('Octopus products API error');
  }

  const json = await response.json();

  const products = json.results || [];

  /*
    優先搵名稱包含 Tracker 嘅產品，
    而且目前日期仍然有效。
  */

  const today = new Date();

  const candidates = products.filter(product => {

    const name =
      `${product.display_name || ''} ${product.full_name || ''} ${product.code || ''}`
      .toLowerCase();

    const isTracker =
      name.includes('tracker');

    if(!isTracker) return false;

    const availableFrom =
      product.available_from
        ? new Date(product.available_from)
        : null;

    const availableTo =
      product.available_to
        ? new Date(product.available_to)
        : null;

    if(availableFrom && today < availableFrom)
      return false;

    if(availableTo && today > availableTo)
      return false;

    return true;
  });

  /*
    優先選最近開始的 product。
  */

  candidates.sort((a,b)=>{

    const da =
      a.available_from
        ? new Date(a.available_from).getTime()
        : 0;

    const db =
      b.available_from
        ? new Date(b.available_from).getTime()
        : 0;

    return db-da;
  });

  if(!candidates.length){

    throw new Error(
      '搵唔到目前有效嘅 Tracker product。'
    );
  }

  /*
    再按 tariff code 嘗試確認 region。
  */

  const preferred =
    candidates.find(product => {

      const text =
        JSON.stringify(product).toUpperCase();

      return text.includes(`_${region}`);

    });

  return preferred || candidates[0];
}


/* =========================
   TARIFF HELPERS
========================= */

function findTariff(product, fuel){

  const tariffs =
    product.single_register_electricity_tariffs ||
    product.single_register_gas_tariffs ||
    {};

  const keys = Object.keys(tariffs);

  if(!keys.length) return null;

  const region =
    data.settings.region.replace('_','');

  /*
    優先搵指定 region。
  */

  const regionalKey =
    keys.find(k =>
      k.toUpperCase().includes(`_${region}`)
    );

  if(regionalKey){
    return tariffs[regionalKey];
  }

  return tariffs[keys[0]];
}


/* =========================
   GET CURRENT RATES
========================= */

async function loadTrackerRates(){

  const status =
    document.getElementById('trackerStatus');

  status.textContent =
    '正在讀取目前 Tracker 價格…';

  status.classList.add('loading');

  try{

    const product =
      await findCurrentTrackerProduct();

    console.log('Tracker product:',product);

    /*
      product endpoint 可以直接提供 tariff
      嘅 unit rates / standing charges history URL。

      如果 product 本身沒有 tariff data，
      就嘗試由 product code 建 endpoint。
    */

    const region =
      data.settings.region.replace('_','');

    let elecUnit = null;
    let gasUnit = null;
    let elecStanding = null;
    let gasStanding = null;

    /*
      建立 tariff codes。

      注意：只使用目前 product code，
      唔再硬編舊版本。
    */

    const productCode =
      product.code;

    const elecCode =
      `E-1R-${productCode}-${region}`;

    const gasCode =
      `G-1R-${productCode}-${region}`;

    /*
      讀目前 unit rates。
    */

    const elecUrl =
      `https://api.octopus.energy/v1/products/${productCode}/electricity-tariffs/${elecCode}/standard-unit-rates/?period_from=${todayUTC()}&period_to=${tomorrowUTC()}`;

    const gasUrl =
      `https://api.octopus.energy/v1/products/${productCode}/gas-tariffs/${gasCode}/standard-unit-rates/?period_from=${todayUTC()}&period_to=${tomorrowUTC()}`;

    const elecStandingUrl =
      `https://api.octopus.energy/v1/products/${productCode}/electricity-tariffs/${elecCode}/standing-charges/?period_from=${todayUTC()}&period_to=${tomorrowUTC()}`;

    const gasStandingUrl =
      `https://api.octopus.energy/v1/products/${productCode}/gas-tariffs/${gasCode}/standing-charges/?period_from=${todayUTC()}&period_to=${tomorrowUTC()}`;

    const responses =
      await Promise.all([
        fetch(elecUrl),
        fetch(gasUrl),
        fetch(elecStandingUrl),
        fetch(gasStandingUrl)
      ]);

    const results =
      await Promise.all(
        responses.map(async r => {

          if(!r.ok) return null;

          return await r.json();

        })
      );

    const [
      elecJson,
      gasJson,
      elecStandingJson,
      gasStandingJson
    ] = results;

    elecUnit =
      getFirstRate(elecJson);

    gasUnit =
      getFirstRate(gasJson);

    elecStanding =
      getFirstRate(elecStandingJson);

    gasStanding =
      getFirstRate(gasStandingJson);

    /*
      如果 API 讀唔到某一項，
      保留之前成功取得嘅值。
    */

    if(
      elecUnit === null &&
      gasUnit === null &&
      elecStanding === null &&
      gasStanding === null
    ){
      throw new Error(
        'Octopus API 暫時未回傳 Tracker rates'
      );
    }

    const today =
      localDate();

    data.rates[today] = {
      electricityUnit: elecUnit,
      gasUnit: gasUnit,
      electricityStanding: elecStanding,
      gasStanding: gasStanding,
      productCode: productCode,
      fetchedAt: new Date().toISOString()
    };

    saveData();

    renderCurrentRates();

    status.classList.remove('loading');

    status.innerHTML =
      `已更新 · ${escapeHtml(product.display_name || product.code)}`;

    render();

  }catch(error){

    console.error(error);

    status.classList.remove('loading');

    status.innerHTML =
      `⚠️ 暫時讀唔到最新 Tracker 價格<br>
       <span class="muted">${escapeHtml(error.message)}</span>`;

    /*
      如果之前有 cache，
      照樣顯示。
    */

    renderCurrentRates();
  }
}


/* =========================
   DATE HELPERS
========================= */

function localDate(){

  const d = new Date();

  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');

  return `${y}-${m}-${day}`;
}

function todayUTC(){

  return new Date().toISOString();
}

function tomorrowUTC(){

  const d = new Date();

  d.setDate(d.getDate()+1);

  return d.toISOString();
}

function getFirstRate(json){

  if(!json) return null;

  const results =
    json.results || [];

  if(!results.length)
    return null;

  /*
    優先用目前有效嘅一項。
  */

  const now =
    Date.now();

  const active =
    results.find(r => {

      const from =
        r.valid_from
          ? new Date(r.valid_from).getTime()
          : 0;

      const to =
        r.valid_to
          ? new Date(r.valid_to).getTime()
          : Infinity;

      return now >= from && now < to;

    });

  const rate =
    active || results[0];

  if(
    rate.value_inc_vat !== undefined
  ){
    return Number(rate.value_inc_vat);
  }

  return null;
}


/* =========================
   CURRENT RATE DISPLAY
========================= */

function getLatestRate(){

  const dates =
    Object.keys(data.rates).sort();

  if(!dates.length)
    return null;

  return data.rates[dates[dates.length-1]];
}

function renderCurrentRates(){

  const rate =
    getLatestRate();

  if(!rate) return;

  document.getElementById('trackerElec').textContent =
    rate.electricityUnit !== null
      ? `${rate.electricityUnit.toFixed(2)}p/kWh`
      : '—';

  document.getElementById('trackerGas').textContent =
    rate.gasUnit !== null
      ? `${rate.gasUnit.toFixed(2)}p/kWh`
      : '—';

  document.getElementById('trackerElecStanding').textContent =
    rate.electricityStanding !== null
      ? `${rate.electricityStanding.toFixed(2)}p/day`
      : '—';

  document.getElementById('trackerGasStanding').textContent =
    rate.gasStanding !== null
      ? `${rate.gasStanding.toFixed(2)}p/day`
      : '—';
}


/* =========================
   ADD READING
========================= */

function addReading(){

  const date =
    document.getElementById('entryDate').value;

  const electricity =
    Number(document.getElementById('elecReading').value);

  const gas =
    Number(document.getElementById('gasReading').value);

  if(!date){
    alert('請選擇日期');
    return;
  }

  if(
    !Number.isFinite(electricity) ||
    !Number.isFinite(gas)
  ){
    alert('請輸入有效讀數');
    return;
  }

  data.entries[date] = {
    electricity,
    gas
  };

  saveData();

  /*
    先嘗試取得當日價格。
    如果係今日，就用最新 Tracker。
  */

  if(date === localDate()){
    loadTrackerRates();
  }

  render();

  document.getElementById('elecReading').value='';
  document.getElementById('gasReading').value='';
}


/* =========================
   CALCULATIONS
========================= */

function sortedEntries(){

  return Object.entries(data.entries)
    .sort((a,b)=>a[0].localeCompare(b[0]));
}

function calculatePeriods(){

  const entries =
    sortedEntries();

  const periods = [];

  for(let i=1;i<entries.length;i++){

    const [date1,r1] = entries[i-1];
    const [date2,r2] = entries[i];

    const eUse =
      Number(r2.electricity)-Number(r1.electricity);

    const gUse =
      Number(r2.gas)-Number(r1.gas);

    if(eUse < 0 || gUse < 0)
      continue;

    const days =
      Math.max(
        1,
        Math.round(
          (
            new Date(date2)-new Date(date1)
          ) / 86400000
        )
      );

    /*
      目前版只用已儲存嘅 rate。

      如果歷史日期冇 rate，
      就唔會亂估。
    */

    const rate =
      data.rates[date2] ||
      getLatestRate();

    if(!rate)
      continue;

    const fuseElec =
      eUse * data.settings.fuseElecUnit / 100 +
      days * data.settings.fuseElecStanding / 100;

    const fuseGas =
      gUse * data.settings.fuseGasUnit / 100 +
      days * data.settings.fuseGasStanding / 100;

    const trackerElec =
      rate.electricityUnit !== null
        ? eUse * rate.electricityUnit / 100
          + days *
            (rate.electricityStanding || 0) / 100
        : null;

    const trackerGas =
      rate.gasUnit !== null
        ? gUse * rate.gasUnit / 100
          + days *
            (rate.gasStanding || 0) / 100
        : null;

    const fuse =
      fuseElec + fuseGas;

    const tracker =
      trackerElec !== null &&
      trackerGas !== null
        ? trackerElec + trackerGas
        : null;

    periods.push({
      start:date1,
      end:date2,
      days,
      eUse,
      gUse,
      fuse,
      tracker,
      saving:
        tracker !== null
          ? fuse-tracker
          : null
    });
  }

  return periods;
}


/* =========================
   RENDER
========================= */

function setView(view){

  currentView=view;

  document
    .querySelectorAll('.tab')
    .forEach(x=>x.classList.remove('active'));

  document
    .getElementById(
      view === 'month'
        ? 'tabMonth'
        : view === 'day'
          ? 'tabDay'
          : 'tabAll'
    )
    .classList.add('active');

  render();
}

function render(){

  renderCurrentRates();

  const periods =
    calculatePeriods();

  const results =
    document.getElementById('results');

  if(!periods.length){

    results.innerHTML =
      `<p>暫時未有可以比較嘅完整期間。<br>
      至少需要兩次不同日期嘅電／Gas讀數。</p>`;

    document.getElementById('summaryDifference').textContent='£0.00';
    document.getElementById('summaryText').textContent='尚未有足夠數據';

    return;
  }

  let list = periods;

  if(currentView === 'month'){
    list = groupByMonth(periods);
  }

  if(currentView === 'day'){
    list = periods;
  }

  if(currentView === 'all'){
    list = [{
      start:periods[0].start,
      end:periods[periods.length-1].end,
      days:periods.reduce((a,x)=>a+x.days,0),
      eUse:periods.reduce((a,x)=>a+x.eUse,0),
      gUse:periods.reduce((a,x)=>a+x.gUse,0),
      fuse:periods.reduce((a,x)=>a+x.fuse,0),
      tracker:
        periods.every(x=>x.tracker!==null)
          ? periods.reduce((a,x)=>a+x.tracker,0)
          : null
    }];
  }

  const totalFuse =
    periods.reduce((a,x)=>a+x.fuse,0);

  const trackerPeriods =
    periods.filter(x=>x.tracker!==null);

  const totalTracker =
    trackerPeriods.reduce((a,x)=>a+x.tracker,0);

  if(trackerPeriods.length){

    const saving =
      totalFuse-totalTracker;

    document.getElementById('summaryDifference').textContent =
      money(Math.abs(saving));

    document.getElementById('summaryDifference').className =
      'big '+(saving>=0?'good':'bad');

    document.getElementById('summaryText').textContent =
      saving>=0
        ? `Tracker 暫時比 Fuse 平約 ${money(saving)}`
        : `Fuse 暫時比 Tracker 平約 ${money(-saving)}`;

  }

  results.innerHTML =
    list.map(renderPeriod).join('');
}


function groupByMonth(periods){

  const groups={};

  periods.forEach(p=>{

    const month =
      p.end.slice(0,7);

    if(!groups[month]){

      groups[month]={
        start:p.start,
        end:p.end,
        days:0,
        eUse:0,
        gUse:0,
        fuse:0,
        tracker:0,
        trackerAvailable:true
      };

    }

    const g=groups[month];

    g.end=p.end;
    g.days+=p.days;
    g.eUse+=p.eUse;
    g.gUse+=p.gUse;
    g.fuse+=p.fuse;

    if(p.tracker===null){
      g.trackerAvailable=false;
    }else{
      g.tracker+=p.tracker;
    }
  });

  return Object.values(groups)
    .map(g=>({

      ...g,

      tracker:
        g.trackerAvailable
          ? g.tracker
          : null

    }))
    .sort((a,b)=>a.end.localeCompare(b.end));

}


function renderPeriod(p){

  const saving =
    p.tracker !== null
      ? p.fuse-p.tracker
      : null;

  return `
    <div class="entry">

      <div class="entry-date">
        ${formatDate(p.end)}
      </div>

      <div class="small">
        ${formatDate(p.start)}
        → ${formatDate(p.end)}
        · ${p.days}日
      </div>

      <div class="stats" style="margin-top:10px">

        <div class="stat">
          <div class="title">Electricity</div>
          <div class="value">
            ${p.eUse.toFixed(1)} kWh
          </div>
        </div>

        <div class="stat">
          <div class="title">Gas</div>
          <div class="value">
            ${p.gUse.toFixed(1)} kWh
          </div>
        </div>

        <div class="stat">
          <div class="title">Fuse</div>
          <div class="value">
            £${p.fuse.toFixed(2)}
          </div>
        </div>

        <div class="stat">
          <div class="title">Tracker</div>
          <div class="value">
            ${
              p.tracker !== null
                ? '£'+p.tracker.toFixed(2)
                : '—'
            }
          </div>
        </div>

      </div>

      ${
        saving !== null
          ? `
            <div class="small" style="margin-top:9px">
              ${
                saving>=0
                  ? `<span class="good">
                      Tracker 平 £${saving.toFixed(2)}
                    </span>`
                  : `<span class="bad">
                      Fuse 平 £${(-saving).toFixed(2)}
                    </span>`
              }
            </div>
          `
          : ''
      }

    </div>
  `;
}


/* =========================
   EDIT / DELETE
========================= */

function editEntry(date){

  const e =
    data.entries[date];

  if(!e) return;

  document.getElementById('entryDate').value=date;
  document.getElementById('elecReading').value=e.electricity;
  document.getElementById('gasReading').value=e.gas;

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });
}

function deleteEntry(date){

  if(!confirm(`確定刪除 ${date} 嘅紀錄？`))
    return;

  delete data.entries[date];

  saveData();

  render();
}


/* =========================
   EXPORT / IMPORT
========================= */

function exportData(){

  const blob =
    new Blob(
      [JSON.stringify(data,null,2)],
      {type:'application/json'}
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement('a');

  a.href=url;

  a.download=
    `energy-data-${localDate()}.json`;

  a.click();

  URL.revokeObjectURL(url);
}


function importData(){

  document
    .getElementById('importFile')
    .click();

}

function handleImport(event){

  const file =
    event.target.files[0];

  if(!file) return;

  const reader =
    new FileReader();

  reader.onload=()=>{

    try{

      const imported =
        JSON.parse(reader.result);

      if(!imported.entries)
        throw new Error();

      data = {
        settings:{
          ...DEFAULT_SETTINGS,
          ...(imported.settings||{})
        },
        entries:imported.entries||{},
        rates:imported.rates||{}
      };

      saveData();

      loadData();
      render();

      alert('資料已成功匯入');

    }catch(e){

      alert('JSON 檔案格式不正確');

    }

  };

  reader.readAsText(file);
}


/* =========================
   CLEAR
========================= */

function clearData(){

  if(
    !confirm(
      '⚠️ 確定清除全部電錶紀錄及價格資料？'
    )
  ) return;

  localStorage.removeItem(STORE_KEY);

  data={
    settings:{...DEFAULT_SETTINGS},
    entries:{},
    rates:{}
  };

  loadData();
  render();
}


/* =========================
   HELPERS
========================= */

function money(value){

  return '£'+Number(value).toFixed(2);

}

function formatDate(date){

  const d =
    new Date(date+'T12:00:00');

  return d.toLocaleDateString(
    'en-GB',
    {
      day:'2-digit',
      month:'short',
      year:'numeric'
    }
  );

}

function escapeHtml(value){

  return String(value)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");

}


/* =========================
   START
========================= */

document.getElementById('entryDate').value =
  localDate();

loadData();
render();

/*
  開頁面即嘗試取得目前 Tracker 價格。
*/

loadTrackerRates();

</script>

<script>

/* =========================================================
   STORAGE
========================================================= */

const STORE_KEY = "octo-tracker-data";


let data = {

  settings:{

    gspRegion:"_B",

    fuseElecMonthly:0,
    fuseElecStanding:41.44,
    fuseElecUnit:23.24,

    fuseGasMonthly:0,
    fuseGasStanding:10.83,
    fuseGasUnit:7.55,

    gasUnit:"kwh",
    gasFactor:11.1

  },

  entries:{},

  rates:{}

};


let currentView = "all";


/* =========================================================
   TRACKER VERSIONS
========================================================= */

const TRACKER_VERSIONS = [

  {
    code:"SILVER-26-04-01",
    from:"2026-04-01",
    to:null
  },

  {
    code:"SILVER-25-09-02",
    from:"2025-09-02",
    to:"2026-03-31"
  },

  {
    code:"SILVER-25-04-15",
    from:"2025-04-15",
    to:"2025-09-01"
  },

  {
    code:"SILVER-25-04-11",
    from:"2025-04-11",
    to:"2025-04-14"
  },

  {
    code:"SILVER-24-12-31",
    from:"2024-12-31",
    to:"2025-04-10"
  },

  {
    code:"SILVER-24-10-01",
    from:"2024-10-01",
    to:"2024-12-30"
  },

  {
    code:"SILVER-24-07-01",
    from:"2024-07-01",
    to:"2024-09-30"
  },

  {
    code:"SILVER-24-04-03",
    from:"2024-04-03",
    to:"2024-06-30"
  },

  {
    code:"SILVER-23-12-06",
    from:"2023-12-06",
    to:"2024-04-02"
  },

  {
    code:"SILVER-FLEX-22-11-25",
    from:"2022-11-25",
    to:"2023-12-05"
  }

];


/* =========================================================
   BASIC HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}


function todayString(){

  const d = new Date();

  const y = d.getFullYear();

  const m =
    String(d.getMonth()+1)
      .padStart(2,"0");

  const day =
    String(d.getDate())
      .padStart(2,"0");

  return `${y}-${m}-${day}`;

}


function yesterdayString(){

  const d = new Date();

  d.setDate(
    d.getDate()-1
  );

  const y = d.getFullYear();

  const m =
    String(d.getMonth()+1)
      .padStart(2,"0");

  const day =
    String(d.getDate())
      .padStart(2,"0");

  return `${y}-${m}-${day}`;

}


function formatDate(dateStr){

  if(!dateStr){
    return "";
  }

  const d =
    new Date(
      dateStr + "T00:00:00"
    );

  return d.toLocaleDateString(
    "zh-HK",
    {
      year:"numeric",
      month:"long",
      day:"numeric"
    }
  );

}


function formatMoney(n){

  if(
    n === null ||
    n === undefined ||
    !Number.isFinite(n)
  ){
    return "—";
  }

  return "£" + n.toFixed(2);

}


function num(v){

  const n = Number(v);

  return Number.isFinite(n)
    ? n
    : null;

}


function daysInMonth(month){

  const [
    y,
    m
  ] =
    month
      .split("-")
      .map(Number);

  return new Date(
    y,
    m,
    0
  ).getDate();

}


/* =========================================================
   STORAGE LOAD
========================================================= */

async function loadData(){

  let loadedFromWindowStorage = false;

  try{

    if(
      window.storage &&
      window.storage.get
    ){

      const saved =
        await window.storage.get(
          STORE_KEY
        );

      if(saved){

        let parsed = null;

        if(
          typeof saved === "string"
        ){

          parsed =
            JSON.parse(saved);

        }else if(saved.value){

          parsed =
            typeof saved.value === "string"
              ? JSON.parse(saved.value)
              : saved.value;

        }

        if(
          parsed &&
          typeof parsed === "object"
        ){

          data = {

            settings:{
              ...data.settings,
              ...(parsed.settings || {})
            },

            entries:{
              ...(parsed.entries || {})
            },

            rates:{
              ...(parsed.rates || {})
            }

          };

          loadedFromWindowStorage = true;

        }

      }

    }

  }catch(e){

    console.warn(
      "window.storage load failed",
      e
    );

  }


  if(!loadedFromWindowStorage){

    try{

      const local =
        localStorage.getItem(
          STORE_KEY
        );

      if(local){

        const parsed =
          JSON.parse(local);

        data = {

          settings:{
            ...data.settings,
            ...(parsed.settings || {})
          },

          entries:{
            ...(parsed.entries || {})
          },

          rates:{
            ...(parsed.rates || {})
          }

        };

      }

    }catch(e){

      console.warn(
        "localStorage load failed",
        e
      );

    }

  }

}


/* =========================================================
   STORAGE SAVE
========================================================= */

async function saveData(){

  const text =
    JSON.stringify(data);


  try{

    if(
      window.storage &&
      window.storage.set
    ){

      await window.storage.set(
        STORE_KEY,
        text
      );

    }

  }catch(e){

    console.warn(
      "window.storage save failed",
      e
    );

  }


  try{

    localStorage.setItem(
      STORE_KEY,
      text
    );

  }catch(e){

    console.warn(
      "localStorage save failed",
      e
    );

  }

}


/* =========================================================
   SETTINGS
========================================================= */

function loadSettingsIntoForm(){

  const s =
    data.settings;


  $("gspRegion").value =
    s.gspRegion || "_B";


  $("fuseElecMonthly").value =
    s.fuseElecMonthly ?? 0;


  $("fuseElecStanding").value =
    s.fuseElecStanding ?? 41.44;


  $("fuseElecUnit").value =
    s.fuseElecUnit ?? 23.24;


  $("fuseGasMonthly").value =
    s.fuseGasMonthly ?? 0;


  $("fuseGasStanding").value =
    s.fuseGasStanding ?? 10.83;


  $("fuseGasUnit").value =
    s.fuseGasUnit ?? 7.55;


  $("gasUnit").value =
    s.gasUnit || "kwh";


  $("gasFactor").value =
    s.gasFactor ?? 11.1;

}


async function saveSettings(){

  data.settings = {

    gspRegion:
      $("gspRegion").value,

    fuseElecMonthly:
      num(
        $("fuseElecMonthly").value
      ) || 0,

    fuseElecStanding:
      num(
        $("fuseElecStanding").value
      ) || 0,

    fuseElecUnit:
      num(
        $("fuseElecUnit").value
      ) || 0,

    fuseGasMonthly:
      num(
        $("fuseGasMonthly").value
      ) || 0,

    fuseGasStanding:
      num(
        $("fuseGasStanding").value
      ) || 0,

    fuseGasUnit:
      num(
        $("fuseGasUnit").value
      ) || 0,

    gasUnit:
      $("gasUnit").value,

    gasFactor:
      num(
        $("gasFactor").value
      ) || 11.1

  };


  await saveData();


  $("settingsStatus").textContent =
    "設定已儲存 ✓";

  $("settingsStatus").className =
    "small success";


  render();

}


/* =========================================================
   TRACKER VERSION
========================================================= */

function getTrackerVersion(dateStr){

  return TRACKER_VERSIONS.find(
    v => {

      if(dateStr < v.from){
        return false;
      }

      if(
        v.to &&
        dateStr > v.to
      ){
        return false;
      }

      return true;

    }
  ) || null;

}


/* =========================================================
   OCTOPUS API
========================================================= */

function buildTariffCode(
  productCode,
  region,
  fuel
){

  const regionCode =
    region.replace("_","");


  if(fuel === "elec"){

    return `E-1R-${productCode}-${regionCode}`;

  }


  return `G-1R-${productCode}-${regionCode}`;

}


async function fetchProductTariff(
  productCode,
  region,
  fuel
){

  const tariffCode =
    buildTariffCode(
      productCode,
      region,
      fuel
    );


  const elecUrl =
    "https://api.octopus.energy/v1/products/" +
    encodeURIComponent(productCode) +
    "/electricity-tariffs/" +
    encodeURIComponent(tariffCode) +
    "/standard-unit-rates/";


  const gasUrl =
    "https://api.octopus.energy/v1/products/" +
    encodeURIComponent(productCode) +
    "/gas-tariffs/" +
    encodeURIComponent(tariffCode) +
    "/standard-unit-rates/";


  const target =
    fuel === "elec"
      ? elecUrl
      : gasUrl;


  const res =
    await fetch(target);


  if(!res.ok){

    throw new Error(
      `Octopus API ${res.status}`
    );

  }


  return await res.json();

}


/* =========================================================
   FIND RATE
========================================================= */

function findRateForDate(
  results,
  dateStr
){

  if(
    !results ||
    !Array.isArray(
      results.results
    )
  ){

    return null;

  }


  const target =
    new Date(
      dateStr + "T12:00:00"
    );


  for(
    const r of results.results
  ){

    if(!r.valid_from){
      continue;
    }


    const from =
      new Date(
        r.valid_from
      );


    let to = null;


    if(r.valid_to){

      to =
        new Date(
          r.valid_to
        );

    }


    if(
      target >= from &&
      (!to || target < to)
    ){

      return {

        unit:
          r.value_inc_vat,

        standing:
          r.standing_charge_inc_vat

      };

    }

  }


  return null;

}


/* =========================================================
   FETCH RATE FOR ONE DATE
========================================================= */

async function fetchRateForDate(
  dateStr,
  silent=false
){

  const version =
    getTrackerVersion(
      dateStr
    );


  if(!version){

    $("trackerStatus").className =
      "status error";

    $("trackerStatus").innerHTML =
      "搵唔到呢日對應嘅 Tracker tariff version。";

    return false;

  }


  const region =
    data.settings.gspRegion ||
    "_B";


  $("trackerStatus").className =
    "status warn";

  $("trackerStatus").innerHTML =
    `正在查詢 ${formatDate(dateStr)} Tracker 價格…`;


  $("fetchRateBtn").disabled =
    true;


  try{

    const [
      elecResults,
      gasResults
    ] =
      await Promise.all([

        fetchProductTariff(
          version.code,
          region,
          "elec"
        ),

        fetchProductTariff(
          version.code,
          region,
          "gas"
        )

      ]);


    const elec =
      findRateForDate(
        elecResults,
        dateStr
      );


    const gas =
      findRateForDate(
        gasResults,
        dateStr
      );


    if(
      !elec ||
      !gas
    ){

      throw new Error(
        "API 有回覆，但搵唔到指定日期價格"
      );

    }


    data.rates[dateStr] = {

      elecUnit:
        elec.unit,

      elecStanding:
        elec.standing,

      gasUnit:
        gas.unit,

      gasStanding:
        gas.standing,

      source:"auto",

      product:
        version.code,

      updatedAt:
        new Date().toISOString()

    };


    await saveData();


    loadRateIntoForm(
      dateStr
    );


    if(!silent){

      $("entryStatus").textContent =
        "Tracker 價格已更新 ✓";

      $("entryStatus").className =
        "small success";

    }


    render();


    return true;


  }catch(e){

    console.error(e);


    $("trackerStatus").className =
      "status error";


    $("trackerStatus").innerHTML =
      "查詢 Tracker 價格失敗。<br>" +
      `<span class="small">${e.message}</span>`;


    if(!silent){

      $("entryStatus").textContent =
        "查詢失敗，請稍後再試。";

      $("entryStatus").className =
        "small error-text";

    }


    return false;


  }finally{

    $("fetchRateBtn").disabled =
      false;

  }

}

/* =========================================================
   SAVE ENTRY
========================================================= */

async function saveEntry(){

  const dateStr =
    $("entryDate").value;


  if(!dateStr){

    $("entryStatus").textContent =
      "請先選擇日期。";

    $("entryStatus").className =
      "small error-text";

    return;

  }


  const elec =
    num(
      $("entryElec").value
    );


  const gas =
    num(
      $("entryGas").value
    );


  if(
    elec === null ||
    gas === null
  ){

    $("entryStatus").textContent =
      "請輸入 Electricity 同 Gas 使用量。";

    $("entryStatus").className =
      "small error-text";

    return;

  }


  data.entries[dateStr] = {

    elec,
    gas,

    updatedAt:
      new Date().toISOString()

  };


  const te =
    num(
      $("trackerElecUnit").value
    );


  const tes =
    num(
      $("trackerElecStanding").value
    );


  const tg =
    num(
      $("trackerGasUnit").value
    );


  const tgs =
    num(
      $("trackerGasStanding").value
    );


  if(
    te !== null &&
    tes !== null &&
    tg !== null &&
    tgs !== null
  ){

    const oldRate =
      data.rates[dateStr];


    const sameAsOld =
      oldRate &&
      oldRate.elecUnit === te &&
      oldRate.elecStanding === tes &&
      oldRate.gasUnit === tg &&
      oldRate.gasStanding === tgs;


    data.rates[dateStr] = {

      elecUnit:te,

      elecStanding:tes,

      gasUnit:tg,

      gasStanding:tgs,

      source:
        sameAsOld &&
        oldRate.source === "auto"
          ? "auto"
          : "manual",

      product:
        oldRate?.product || "",

      updatedAt:
        new Date().toISOString()

    };

  }


  await saveData();


  $("entryStatus").textContent =
    `${formatDate(dateStr)} 已儲存 ✓`;

  $("entryStatus").className =
    "small success";


  loadEntryIntoForm(
    dateStr
  );


  render();

}

/* =========================================================
   CALCULATE FUSE
========================================================= */

function calculateFuse(
  dateStr
){

  const entry =
    data.entries[dateStr];


  if(!entry){
    return null;
  }


  const s =
    data.settings;


  let gasKwh =
    Number(entry.gas) || 0;


  if(
    s.gasUnit === "m3"
  ){

    gasKwh *=
      Number(
        s.gasFactor || 11.1
      );

  }


  const elecUsage =
    Number(entry.elec) || 0;


  const elecUnitCost =
    elecUsage *
    Number(
      s.fuseElecUnit || 0
    ) /
    100;


  const gasUnitCost =
    gasKwh *
    Number(
      s.fuseGasUnit || 0
    ) /
    100;


  const standing =
    (
      Number(
        s.fuseElecStanding || 0
      ) +

      Number(
        s.fuseGasStanding || 0
      )
    ) / 100;


  return {

    elec:elecUnitCost,

    gas:gasUnitCost,

    standing,

    total:
      elecUnitCost +
      gasUnitCost +
      standing

  };

}


/* =========================================================
   CALCULATE TRACKER
========================================================= */

function calculateTracker(
  dateStr
){

  const entry =
    data.entries[dateStr];


  const rate =
    data.rates[dateStr];


  if(
    !entry ||
    !rate
  ){

    return null;

  }


  let gasKwh =
    Number(entry.gas) || 0;


  if(
    data.settings.gasUnit === "m3"
  ){

    gasKwh *=
      Number(
        data.settings.gasFactor || 11.1
      );

  }


  const elec =
    Number(entry.elec || 0) *
    Number(rate.elecUnit || 0) /
    100;


  const gas =
    gasKwh *
    Number(rate.gasUnit || 0) /
    100;


  const standing =
    (
      Number(
        rate.elecStanding || 0
      ) +

      Number(
        rate.gasStanding || 0
      )
    ) / 100;


  return {

    elec,

    gas,

    standing,

    total:
      elec +
      gas +
      standing

  };

}


/* =========================================================
   MONTH CALCULATION
========================================================= */

function calculateMonth(
  month
){

  const prefix =
    month + "-";


  const dates =
    Object.keys(data.entries)
      .filter(
        d => d.startsWith(prefix)
      )
      .sort();


  if(!dates.length){

    return {

      dates:[],

      fuseTotal:0,

      trackerTotal:0,

      trackerDates:0

    };

  }


  let fuseTotal = 0;

  let trackerTotal = 0;

  let trackerDates = 0;


  for(
    const date of dates
  ){

    const f =
      calculateFuse(date);


    if(f){

      fuseTotal +=
        f.total;

    }


    const t =
      calculateTracker(date);


    if(t){

      trackerTotal +=
        t.total;

      trackerDates++;

    }

  }


  const s =
    data.settings;


  const days =
    daysInMonth(month);


  const monthlyFees =
    Number(
      s.fuseElecMonthly || 0
    ) +

    Number(
      s.fuseGasMonthly || 0
    );


  if(
    dates.length &&
    days > 0
  ){

    fuseTotal +=
      monthlyFees *
      (
        dates.length /
        days
      );

  }


  return {

    dates,

    fuseTotal,

    trackerTotal,

    trackerDates

  };

}


/* =========================================================
   DAILY ROW
========================================================= */

function renderDailyRow(
  dateStr
){

  const entry =
    data.entries[dateStr];


  if(!entry){
    return "";
  }


  const fuse =
    calculateFuse(dateStr);


  const tracker =
    calculateTracker(dateStr);


  let trackerHTML =

  if(tracker){

    trackerHTML =
      `<span class="tracker">

      </span>`;

  }


  let diffHTML =

  if(
    fuse &&
    tracker
  ){

      fuse.total -
      tracker.total;


    diffHTML =
      `<span class="diff">
        ${formatMoney(diff)}
      </span>`;

  }


  const rate =
    data.rates[dateStr];


  const badge =
    rate

      ? `<span class="badge ${
          rate.source === "manual"
            ? "manual"
            : "auto"
        }">${
          rate.source === "manual"
            ? "手動"
            : "Tracker"
        }</span>`

      : "";


  return `

    <div
      class="entry-row"
      data-date="${dateStr}"
    >

      <div class="row">

        <div>

          <div class="entry-date">
            ${formatDate(dateStr)}

            · Gas ${Number(entry.gas).toFixed(2)}
          </div>

          </div>

        <div class="cost">

          <div>
            Tracker ${trackerHTML}
          </div>

          <div class="small">
            差額 ${diffHTML}
          </div>

        </div>

      </div>

    </div>

  `;

}

/* =========================================================
   HERO
========================================================= */

function updateHero(
  dates
){

  let totalFuse = 0;

  let totalTracker = 0;

  let count = 0;

  const sparkValues = [];


  for(
    const date of dates
  ){

    const f =
      calculateFuse(date);


    const t =
      calculateTracker(date);


    if(f){

      totalFuse +=
        f.total;

    }


    if(t){

      totalTracker +=
        t.total;

      count++;


      sparkValues.push(
        f.total -
        t.total
      );

    }

  }


  if(!dates.length){

    $("heroDiff").textContent =
      "—";

    $("heroSub").textContent =
      "等待資料";

    $("sparkLine")
      .setAttribute(
        "points",
        ""
      );

    return;

  }


  if(count === 0){

    $("heroDiff").textContent =
      "—";

    $("heroSub").textContent =
      "已有電錶資料，但尚未有 Tracker 價格";

    $("sparkLine")
      .setAttribute(
        "points",
        ""
      );

    return;

  }


  const diff =
    totalFuse -
    totalTracker;


  $("heroDiff").textContent =
    formatMoney(diff);


  if(diff > 0){

    $("heroSub").textContent =
      `Fuse 比 Tracker 貴 ${formatMoney(diff)}`;

  }else if(diff < 0){

    $("heroSub").textContent =
      `Fuse 比 Tracker 平 ${formatMoney(Math.abs(diff))}`;

  }else{

    $("heroSub").textContent =
      "兩者一樣";

  }


  if(
    sparkValues.length > 1
  ){

    const min =
      Math.min(
        ...sparkValues
      );


    const max =
      Math.max(
        ...sparkValues
      );


    const range =
      max - min || 1;


    const points =
      sparkValues
        .map(
          (v,i)=>{

            const x =
              (
                i /
                (
                  sparkValues.length-1
                )
              ) * 500;


            const y =
              48 -
              (
                (
                  (v-min) /
                  range
                ) * 40
              );


            return `${x},${y}`;

          }
        )
        .join(" ");


    $("sparkLine")
      .setAttribute(
        "points",
        points
      );

  }else{

    $("sparkLine")
      .setAttribute(
        "points",
        ""
      );

  }

}

function setView(

){

    .querySelectorAll(".tab")
    .forEach(

        tab.classList.toggle(
          "active",
          tab.dataset.view === view
        );

    );

    );

function updateFilterInfo(){

  ){

    $("filterInfo").textContent =
      `全部紀錄：${

          data.entries
        ).length
      } 日`;

  ){

/* =========================================================
   RENDER
========================================================= */

function render(){

  const history =
    $("history");


  const dates =
    Object.keys(
      data.entries
    )
      .sort()
      .reverse();


  let html = "";


  if(
    currentView === "day"
  ){

    const selected =
      $("historyDay").value;


    if(!selected){

      history.innerHTML =
        `<div class="muted">
          請選擇日期。
        </div>`;

      updateHero([]);

      return;

    }


    if(
      !data.entries[selected]
    ){

      history.innerHTML =
        `<div class="muted">
          ${formatDate(selected)} 未有實際紀錄。
        </div>`;

      updateHero([]);

      return;

    }


    html +=
      renderDailyRow(
        selected
      );


    updateHero([
      selected
    ]);

  }

  else if(
    currentView === "month"
  ){

    const month =
      $("historyMonth").value;


    if(!month){

      history.innerHTML =
        `<div class="muted">
          請選擇月份。
        </div>`;

      updateHero([]);

      return;

    }


    html =
      renderMonth(
        month
      );


    const prefix =
      month + "-";


    const monthDates =
      Object.keys(
        data.entries
      )
        .filter(
          d => d.startsWith(prefix)
        );


    updateHero(
      monthDates
    );

  }

  else{

    if(!dates.length){

      history.innerHTML =
        `<div class="muted">
          暫時未有任何電錶紀錄。
        </div>`;

      updateHero([]);

      return;

    }


    for(
      const date of dates
    ){

      html +=
        renderDailyRow(
          date
        );

    }


    updateHero(
      dates
    );

  }


  history.innerHTML =
    html;


  history
    .querySelectorAll(
      ".entry-row"
    )
    .forEach(
      row => {

        const date =
          row.dataset.date;


        row.style.cursor =
          "pointer";


        row.addEventListener(
          "click",
          ()=>{

            $("entryDate").value =
              date;


            loadEntryIntoForm(
              date
            );


            const entryCard =
              $("entryDate")
                .closest(".card");


            if(entryCard){

              entryCard.scrollIntoView({
                behavior:"smooth",
                block:"start"
              });

            }

          }
        );

      }
    );

}


/* =========================================================

async function fetchAllRates(){

    Object.keys(
      data.entries
    )
      .sort();


  if(!dates.length){

    $("entryStatus").textContent =
      "暫時未有任何電錶紀錄。";

    false;


  $("entryStatus").textContent =
    `完成。新增 ${success} 日 Tracker 價格。`;

  $("entryStatus").className =
    "small success";


  render();

}


/* =========================================================
   SETTINGS COLLAPSE
========================================================= */

$("settingsHeader")
  .addEventListener(
    "click",
    ()=>{

      const content =
        $("settingsContent");


      const arrow =
        $("settingsArrow");


      const isHidden =
        content.classList.contains(
          "hidden"
        );


      if(isHidden){

        content.classList.remove(
          "hidden"
        );

        arrow.textContent =
          "−";

      }else{

        content.classList.add(
          "hidden"
        );

        arrow.textContent =
          "＋";

      }

    }
  );


/* =========================================================
   EVENTS
========================================================= */

$("entryDate")
  .addEventListener(
    "change",
    onDateChanged
  );


$("todayBtn")
  .addEventListener(
    "click",
    ()=>{

      const date =
        todayString();


      $("entryDate").value =
        date;


      onDateChanged();

    }
  );


$("yesterdayBtn")
  .addEventListener(
    "click",
    ()=>{

      const date =
        yesterdayString();


      $("entryDate").value =
        date;


      onDateChanged();

    }
  );


$("fetchRateBtn")
  .addEventListener(
    "click",
    ()=>{

      const date =
        $("entryDate").value;


      if(!date){

        $("entryStatus").textContent =
          "請先選擇日期。";

        $("entryStatus").className =
          "small error-text";

        return;

      }


      fetchRateForDate(
        date
      );

    }
  );


$("fetchAllRatesBtn")
  .addEventListener(
    "click",
    fetchAllRates
  );


$("saveEntryBtn")
  .addEventListener(
    "click",
    saveEntry
  );


$("deleteEntryBtn")
  .addEventListener(
    "click",
    deleteEntry
  );


$("saveSettingsBtn")
  .addEventListener(
    "click",
    saveSettings
  );


document
  .querySelectorAll(
    ".tab"
  )
  .forEach(
    tab => {

      tab.addEventListener(
        "click",
        ()=>{
          setView(
            tab.dataset.view
          );
        }
      );

    }
  );


$("historyMonth")
  .addEventListener(
    "change",
    ()=>{

      updateFilterInfo();

      render();

    }
  );


$("historyDay")
  .addEventListener(
    "change",
    ()=>{

      updateFilterInfo();

      render();

    }
  );


/* =========================================================
   INIT
========================================================= */

async function init(){

  await loadData();


  loadSettingsIntoForm();


  const dates =
    Object.keys(
      data.entries
    )
      .sort();


  const defaultDate =
    dates.length
      ? dates[dates.length-1]
      : yesterdayString();


  $("entryDate").value =
    defaultDate;


  $("historyDay").value =
    defaultDate;


  $("historyMonth").value =
    defaultDate.slice(0,7);


  onDateChanged();


  updateFilterInfo();


  render();

}


init();

</script>

</body>
</html>
